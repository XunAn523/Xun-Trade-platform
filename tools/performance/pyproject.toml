[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emt-gateway-performance"
version = "0.1.0"
description = "Catalog-driven performance harness for EMT gateway"
requires-python = ">=3.10"

[project.scripts]
emt-gateway-perf = "perfbench.cli:main"
emt-gateway-attribution = "perfbench.linux_attribution:main"

[tool.setuptools.packages.find]
include = ["perfbench*"]
