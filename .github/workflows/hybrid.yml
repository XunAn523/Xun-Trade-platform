name: Hybrid compute and OMS regression
on: [push, pull_request]

jobs:
  hybrid:
    timeout-minutes: 25
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install uv==0.13.9
      - run: uv sync --locked --extra ci --python 3.10
      - run: uv run --locked --extra ci cmake -S . -B build/cmake -DCMAKE_BUILD_TYPE=Release -DXUNTRADE_BUILD_PYTHON=ON -DPython3_FIND_STRATEGY=LOCATION
      - run: uv run --locked --extra ci cmake --build build/cmake --config Release
      - run: uv run --locked --extra ci ctest --test-dir build/cmake -C Release --output-on-failure
      - run: uv run --locked --extra ci python -m xuntrade_omsems self-check --require-native
        env:
          XUNTRADE_BACKEND: native
      - run: uv run --locked --extra ci python -m tools.quality.run_acceptance --suite native_core --output-dir build/acceptance/native_core
      - run: uv run --locked --extra ci python -m tools.quality.run_acceptance --suite python_reference --output-dir build/acceptance/python_reference
      - run: uv run --locked --extra ci python -m tools.quality.run_acceptance --catalog build/acceptance/test-catalog.json
      - run: uv run --locked --extra ci python -m tools.quality.wheel_smoke --output-dir build/acceptance/wheel
      - run: uv run --locked --extra ci python -m ruff check .
      - run: uv run --locked --extra ci python tools/quality/check_tradecore_boundary.py
      - run: uv run --locked --extra ci python tools/quality/check_type_ignore_reasons.py
      - run: uv run --locked --extra ci python tools/quality/check_sensitive_content.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-${{ matrix.os }}
          path: |
            build/acceptance/**/*.json
            build/acceptance/**/*.xml
            build/acceptance/**/*.log
            build/acceptance/wheel/dist/*.whl
            build/acceptance/wheel/runtime.txt
            !build/acceptance/**/wheel-env-*/**
            !build/acceptance/**/clean-source-*/**
            !build/acceptance/**/cache/**
          retention-days: 14
