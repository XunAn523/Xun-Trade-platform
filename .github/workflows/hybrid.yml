name: Hybrid compute and OMS regression
on: [push, pull_request]

jobs:
  hybrid:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -e . pytest hypothesis ruff
      - run: cmake -S . -B build/cmake -DCMAKE_BUILD_TYPE=Release -DXUNTRADE_BUILD_PYTHON=ON -DPython3_FIND_STRATEGY=LOCATION
      - run: cmake --build build/cmake --config Release
      - run: ctest --test-dir build/cmake -C Release --output-on-failure
      - run: python -m xuntrade_omsems self-check --require-native
        env:
          XUNTRADE_BACKEND: native
      - run: python -m pytest -q tests/test_hybrid_compute.py tests/test_ems_batch_routing.py tests/test_offline_pipeline.py tests/test_quality_scanner.py tests/test_tradecore_package_boundary.py tests/test_account_session_sharding.py tests/test_journal.py tests/test_gateway.py tests/test_account_execution_router.py tests/test_execution_scheduler.py tests/test_tradecore_oms.py tests/test_execution_session_runtime.py tests/test_account_ownership_fence.py
        env:
          XUNTRADE_BACKEND: native
      - run: python -m pytest -q tests/test_hybrid_compute.py tests/test_account_session_sharding.py tests/test_journal.py
        env:
          XUNTRADE_BACKEND: python
      - run: python -m ruff check .
      - run: python tools/quality/check_tradecore_boundary.py
      - run: python tools/quality/check_sensitive_content.py
